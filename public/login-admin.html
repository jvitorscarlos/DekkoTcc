<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dekko - Login Administrativo</title>

<link
    rel="stylesheet"
    href="../css/admin.css"
>


</head>

<body>


<main class="container">

    <section class="area">

        <div class="titulo-area">

            <div>

                <h2>Login Administrativo</h2>

                <p>
                    Entre com os dados do administrador.
                </p>

            </div>

        </div>

        <form id="formLoginAdmin">

            <div>

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@dekko.com"
                    required
                >

            </div>

            <div>

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </section>

</main>

<script src="../js/login-admin.js"></script>

</body>

</html>
