<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Dekko - Painel Administrativo</title>

<link rel="stylesheet" href="../css/admin.css">


</head>

<body>


<header>

    <div>
        <h1>DEKKO</h1>
        <p>Painel Administrativo</p>
    </div>

    <div>
        <strong>Administrador</strong>
        <span>admin@dekko.com</span>

        <button
            type="button"
            onclick="sairAdmin()"
        >
            Sair
        </button>
    </div>

</header>

<main>

    <section class="dashboard">

        <div class="card">
            <h3>Clientes</h3>
            <strong id="totalClientes">0</strong>
        </div>

        <div class="card">
            <h3>Profissionais</h3>
            <strong id="totalProfissionais">0</strong>
        </div>

        <div class="card">
            <h3>Conversas</h3>
            <strong id="totalConversas">0</strong>
        </div>

        <div class="card">
            <h3>Favoritos</h3>
            <strong id="totalFavoritos">0</strong>
        </div>

    </section>

    <section class="filtros">

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar..."
            onkeyup="pesquisar()"
        >

        <select
            id="regiao"
            onchange="filtrarRegiao()"
        >
            <option value="">Todas as regiões</option>
            <option value="Paracambi">Paracambi</option>
            <option value="Seropédica">Seropédica</option>
            <option value="Japeri">Japeri</option>
            <option value="Queimados">Queimados</option>
        </select>

    </section>

    <section class="area">

        <div class="titulo-area">

            <div>
                <h2>Clientes</h2>

                <span
                    class="contador"
                    id="contadorClientes"
                >
                    0 clientes
                </span>
            </div>

        </div>

        <div class="tabela-container">

            <table id="tabelaClientes">

                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Região</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="corpoClientes"></tbody>

            </table>

        </div>

    </section>

    <section class="area">

        <div class="titulo-area">

            <div>
                <h2>Profissionais</h2>

                <span
                    class="contador"
                    id="contadorProfissionais"
                >
                    0 profissionais
                </span>
            </div>

        </div>

        <div class="tabela-container">

            <table id="tabelaProfissionais">

                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Região</th>
                        <th>Serviço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="corpoProfissionais"></tbody>

            </table>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 Dekko - Painel Administrativo</p>
</footer>

<script src="../js/admin.js?v=3"></script>


</body>

</html>
