<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dekko - Perfil de cliente</title>

    <link rel="stylesheet" href="../css/style.css?v=19">

</head>

<body>

<header>

    <div class="logo">
        De<span>kko</span>
    </div>

    <div class="menu">

        <button
            class="btn-entrar"
            id="btnVoltar"
            type="button"
            onclick="window.location.href='index.html'">

            ← Voltar

        </button>

    </div>

</header>


<main class="criar-perfil">

    <div class="titulo-pagina">

        <div class="tag" id="tagPagina">
            👤 DEKKO • MEU PERFIL
        </div>

        <h1 id="tituloPagina">
            Crie seu <span>perfil.</span>
        </h1>

        <p id="subtituloPagina">
            Adicione sua foto e o nome que você quer usar para conversar com os profissionais.
        </p>

    </div>


    <form
        class="formulario-perfil"
        id="formPerfilCliente">


        <!-- FOTO DE PERFIL -->

        <section class="foto-perfil-area">

            <h2>
                Sua foto de perfil
            </h2>

            <p>
                Escolha uma foto para os profissionais te reconhecerem.
            </p>


            <div class="preview-perfil">

                <div
                    class="avatar-preview"
                    id="avatarPreviewCliente">

                    👤

                </div>

            </div>


            <label
                for="fotoCliente"
                class="btn-foto">

                📷 Escolher foto

            </label>


            <input
                type="file"
                id="fotoCliente"
                name="foto"
                accept="image/*"
                hidden>


            <small id="avisoFoto">
                A foto de perfil é obrigatória.
            </small>

        </section>



        <!-- INFORMAÇÕES -->

        <section class="dados-perfil">

            <h2>
                Sobre você
            </h2>


            <div class="campo">

                <label for="nomeCliente">
                    Nome
                </label>

                <input
                    type="text"
                    id="nomeCliente"
                    name="nome"
                    placeholder="Como você quer ser chamado?"
                    required>

            </div>

        </section>



        <button
            class="btn-form btn-continuar"
            id="btnSalvarPerfil"
            type="submit">

            Finalizar e buscar profissionais →

        </button>

    </form>

</main>



<footer>

    © 2026 <span>Dekko</span> — Encontre. Converse. Resolva.

</footer>



<!-- JS DO PERFIL -->

<script src="../js/criar-perfil-cli.js?v=3"></script>



<!-- VLibras -->

<div vw class="enabled">

    <div
        vw-access-button
        class="active">
    </div>

    <div vw-plugin-wrapper>

        <div class="vw-plugin-top-wrapper"></div>

    </div>

</div>


<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>

    new window.VLibras.Widget(
        "https://vlibras.gov.br/app"
    );

</script>


</body>

</html>
